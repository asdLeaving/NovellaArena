<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导入文稿 · NovellaArena</title>
  <link rel="stylesheet" href="assets/style.css?v=9d32c97bc7490af4faa036ecaa5b76379f3597266494db9a53adf7abcb677ad6">
  <script defer onerror="document.documentElement.classList.add('asset-error')" src="assets/models.js?v=054a39d812e9d32ecd969134ead2162f3179da19ca3ac30b6376b01d8839d58f"></script>
  <script defer onerror="document.documentElement.classList.add('asset-error')" src="assets/import-files.js?v=9a093ca3f2adee69e2e297db52345e52cd286ba0244d71d69830998b7432cd1d"></script>
  <script defer onerror="document.documentElement.classList.add('asset-error')" src="assets/ingest.js?v=594a7626cc9bbef0f01f717a6ced1c355f9ba9db91476d380f0e6b4bf2aae228"></script>
</head>
<body data-page="ingest">
  <p class="error asset-message" role="alert">网页脚本未能加载。<button type="button" onclick="location.reload()">重新加载</button></p>
  <div class="topbar">
    <a class="back" href="index.html">返回主页</a>
    <strong>导入文稿</strong>
  </div>
  <main class="page">
    <p class="lede" id="file-help">把符合「题目_模型_yymmddhhmm.txt」的文稿拖进来。模型名会归一成空格分隔的规范写法，并和已有列合并。网页标注的文稿不会收入。</p>
    <div class="drop" id="drop">
      <div>
        <p>把 .txt 拖到这里，或点击选择文件</p>
        <input id="file" type="file" accept=".txt,text/plain" aria-label="选择 .txt 文稿" aria-describedby="file-help">
      </div>
    </div>
    <section id="panel" class="hidden">
      <div class="preview" id="preview" role="status"></div>
      <div class="choice-stack">
        <div class="field">
          <span id="harnessLabel">Harness</span>
          <div class="choice-row" id="harness" role="group" aria-labelledby="harnessLabel">
            <button type="button" data-value="cursor">cursor</button>
            <button type="button" data-value="codex">codex</button>
            <button type="button" data-value="claude chat">claude chat</button>
            <button type="button" data-value="opencode">opencode</button>
            <button type="button" data-value="__custom">手动填入</button>
          </div>
        </div>
        <label id="harnessCustomWrap" class="hidden">自定义 harness
          <input id="harnessCustom" type="text" autocomplete="off">
        </label>
        <div class="field">
          <span id="effortLabel">Effort</span>
          <div class="choice-row" id="effort" role="group" aria-labelledby="effortLabel">
            <button type="button" data-value="">未记录</button>
            <button type="button" data-value="low">low</button>
            <button type="button" data-value="medium">medium</button>
            <button type="button" data-value="high">high</button>
            <button type="button" data-value="xhigh">xhigh</button>
            <button type="button" data-value="max">max</button>
            <button type="button" data-value="__custom">手动填入</button>
          </div>
        </div>
        <label id="effortCustomWrap" class="hidden">自定义 effort
          <input id="effortCustom" type="text" autocomplete="off">
        </label>
        <div class="field">
          <span id="qualityLabel">生成质量</span>
          <div class="choice-row" id="grade" role="group" aria-labelledby="qualityLabel">
            <button type="button" class="g-unset" data-value="">未定</button>
            <button type="button" class="g-a" data-value="A">A</button>
            <button type="button" class="g-b" data-value="B">B</button>
            <button type="button" class="g-c" data-value="C">C</button>
            <button type="button" class="g-d" data-value="D">D</button>
            <button type="button" class="g-e" data-value="E">E</button>
          </div>
        </div>
        <div id="releaseWrap" class="model-settings hidden">
          <div class="field">
            <span id="releaseDateLabel">模型发布日期</span>
            <span class="date-parts" role="group" aria-labelledby="releaseDateLabel">
              <input id="releaseYear" inputmode="numeric" maxlength="4" placeholder="年" aria-label="年" autocomplete="off">
              <input id="releaseMonth" inputmode="numeric" maxlength="2" placeholder="月" aria-label="月" autocomplete="off">
              <input id="releaseDay" inputmode="numeric" maxlength="2" placeholder="日" aria-label="日" autocomplete="off">
            </span>
          </div>
          <div class="field">
            <span id="modelVisibilityLabel">显示在列表中</span>
            <div class="choice-row" id="modelVisibility" role="group" aria-labelledby="modelVisibilityLabel">
              <button type="button" data-value="yes">是</button>
              <button type="button" data-value="no">否</button>
            </div>
          </div>
        </div>
      </div>
      <div class="stack">
        <label>生成 prompt（可留空；填写后会写入或更新这道题目的 prompt）
          <textarea id="prompt"></textarea>
        </label>
        <div class="field">
          <span id="promptGradeLabel">Prompt 开放度（可选）</span>
          <div class="choice-row" id="promptGrade" role="group" aria-labelledby="promptGradeLabel" aria-describedby="promptGradeHelp">
            <button type="button" class="on" data-value="__keep" aria-pressed="true">保持原评级</button>
            <button type="button" class="g-unset" data-value="">未定</button>
            <button type="button" class="g-a" data-value="A">A</button>
            <button type="button" class="g-b" data-value="B">B</button>
            <button type="button" class="g-c" data-value="C">C</button>
            <button type="button" class="g-d" data-value="D">D</button>
            <button type="button" class="g-e" data-value="E">E</button>
          </div>
          <p class="note" id="promptGradeHelp">表示允许模型原创的开放度，保存后显示在主页题目格。可单独更新评级，无需填写 prompt；选择「未定」可清除已有评级，新题目默认未定。</p>
        </div>
      </div>
      <div class="actions">
        <button class="primary" id="save" type="button">加入网页</button>
        <button class="button" id="export" type="button">下载导入包</button>
        <span id="dirLabel" class="note"></span>
      </div>
      <p id="message" class="note" role="status"></p>
    </section>
  </main>
</body>
</html>
